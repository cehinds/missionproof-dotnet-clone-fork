name: Deploy current MissionProof preview

on:
  push:
    branches:
      - codex/rebuild-no-key
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build repository-path-aware demo
        env:
          VITE_BASE_PATH: /missionproof-dotnet-clone-fork/
          VITE_MISSIONPROOF_DATA_MODE: demo
        run: npm run build
      - name: Verify Sites compatibility
        run: npm run test:sites
      - name: Add GitHub Pages SPA fallback
        run: |
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
